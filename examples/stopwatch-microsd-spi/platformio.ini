; Standalone read-only microSD example for M5Stack StopWatch.
; Build ONLY with: pio run -d examples/stopwatch-microsd-spi
; Do not use generic full-chip upload on devices with protected partitions.
[env:stopwatch_microsd_example]
platform = espressif32@6.12.0
framework = arduino
board = esp32s3box
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
monitor_speed = 115200
build_flags =
    -DBOARD_ID=30
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    https://github.com/m5stack/M5Unified.git#0.3.0
    https://github.com/m5stack/M5GFX.git#0.3.0
    https://github.com/m5stack/M5PM1.git#1.0.7
    https://github.com/m5stack/M5IOE1.git#1.0.9
