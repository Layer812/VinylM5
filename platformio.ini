; VinylM5 R12: retain R4/R5 known-good bootloader and unchanged 16MB partition table.
; TinyUSB OTG MSC requires ARDUINO_USB_MODE=0. USB-Serial/JTAG ROM flash remains accessible.
[env:vinylm5]
platform = espressif32@6.12.0
board = esp32s3box
; The esp32s3box board injects -DARDUINO_USB_MODE=1 (USB-Serial/JTAG).
; TinyUSB USBMSC needs native USB OTG mode (0), not USB-Serial/JTAG mode (1).
; Remove board default instead of redefining it (warning and wrong mode risk).
build_unflags =
    -DARDUINO_USB_MODE=1
; Avoid pulling in unrelated *.cpp files when the project was unpacked into an
; existing build directory (e.g. chain_buzzer_core.cpp from another project).
build_src_filter =
    -<*>
    +<main.cpp>
    +<music_flash.cpp>
    +<record_id3.cpp>
    +<usb_music.cpp>
    +<vinyl_core.cpp>
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 3145728
monitor_speed = 115200
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0
    -DCORE_DEBUG_LEVEL=2
    -DVINYLM5_R12_LIB030=1
lib_deps =
    https://github.com/m5stack/M5Unified.git#0.3.0
    https://github.com/m5stack/M5GFX.git#0.3.0
    https://github.com/m5stack/M5PM1.git#1.0.7
    https://github.com/m5stack/M5IOE1.git#1.0.9
    earlephilhower/ESP8266Audio@1.9.7
